<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'SF Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14">
  <rect x="0" y="0" width="860" height="540" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="860" height="14" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" font-size="12" fill="#6e7681">tool-schema-lint</text>

  <text x="18" y="62" fill="#c9d1d9"><tspan fill="#3fb950" font-weight="700">$</tspan><tspan> tool-schema-lint weather_tool.json --provider all</tspan></text>

  <text x="18" y="92" fill="#c9d1d9"><tspan font-weight="700">get_weather</tspan> <tspan fill="#6e7681">[anthropic]</tspan></text>

  <text x="18" y="116"><tspan fill="#f85149">  ✖</tspan> <tspan fill="#6e7681">at &lt;root&gt; (openai)</tspan></text>
  <text x="18" y="134" fill="#c9d1d9">    Strict mode requires every object to set "additionalProperties": false. <tspan fill="#6e7681">openai-additional-properties</tspan></text>

  <text x="18" y="160"><tspan fill="#f85149">  ✖</tspan> <tspan fill="#6e7681">at &lt;root&gt; (openai)</tspan></text>
  <text x="18" y="178" fill="#c9d1d9">    Every property must be in "required". Missing: when, units. <tspan fill="#6e7681">openai-all-required</tspan></text>

  <text x="18" y="204"><tspan fill="#f85149">  ✖</tspan> <tspan fill="#6e7681">at properties/units (gemini)</tspan></text>
  <text x="18" y="222" fill="#c9d1d9">    Gemini expresses nullability with "nullable": true, not a "null" type. <tspan fill="#6e7681">gemini-nullable-type</tspan></text>

  <text x="18" y="248"><tspan fill="#d29922">  ⚠</tspan> <tspan fill="#6e7681">at properties/city</tspan></text>
  <text x="18" y="266" fill="#c9d1d9">    Property "city" has no description; descriptions improve argument quality. <tspan fill="#6e7681">missing-property-description</tspan></text>

  <text x="18" y="292"><tspan fill="#d29922">  ⚠</tspan> <tspan fill="#6e7681">at &lt;root&gt; (anthropic)</tspan></text>
  <text x="18" y="310" fill="#c9d1d9">    Tool description is only 16 characters. Claude leans on detailed descriptions. <tspan fill="#6e7681">anthropic-thin-description</tspan></text>

  <text x="18" y="336"><tspan fill="#d29922">  ⚠</tspan> <tspan fill="#6e7681">at properties/when (gemini)</tspan></text>
  <text x="18" y="354" fill="#c9d1d9">    Gemini ignores format "email" for type "string". Supported: enum, date-time. <tspan fill="#6e7681">gemini-unsupported-format</tspan></text>

  <text x="18" y="396"><tspan fill="#f85149" font-weight="700">3 errors</tspan><tspan fill="#6e7681">, </tspan><tspan fill="#d29922" font-weight="700">5 warnings</tspan><tspan fill="#6e7681">, 0 info</tspan></text>

  <line x1="18" y1="420" x2="842" y2="420" stroke="#21262d" stroke-width="1"/>

  <text x="18" y="450" fill="#c9d1d9"><tspan fill="#3fb950" font-weight="700">$</tspan><tspan> tool-schema-lint clean_tool.json --provider openai</tspan></text>
  <text x="18" y="478" fill="#c9d1d9"><tspan font-weight="700">search_products</tspan> <tspan fill="#6e7681">[openai]</tspan></text>
  <text x="18" y="500"><tspan fill="#3fb950">  ✓ no issues</tspan></text>
  <text x="18" y="524"><tspan fill="#3fb950" font-weight="700">✓ All clean — 0 errors, 0 warnings.</tspan></text>
</svg>
